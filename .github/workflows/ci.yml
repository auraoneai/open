name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-contracts:
    name: Proofline and release contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Install release-contract dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release plan and schemas
        run: npm run release:contracts
      - name: Verify public repository version surfaces
        run: npm run versions:verify:local
      - name: Lint shipped public UI sources
        run: npm run design:lint:local
      - name: Lint public release workflows
        run: npm run workflows:lint:local

  evalkit:
    name: evalkit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/evalkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install "git+https://github.com/auraoneai/rubric-spec.git" "git+https://github.com/auraoneai/iaa-kit.git"
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p no:cacheprovider -q tests
      - name: Build wheel + sdist
        run: python -m build
      - name: Twine check
        run: |
          python -m pip install twine
          twine check dist/*

  robotics-reviewkit:
    name: robotics-reviewkit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: robotics-reviewkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest jsonschema pyyaml
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p no:cacheprovider -q tests
      - name: Build ReviewKit v2 viewer
        run: |
          cd viewer/reviewkit-v2
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Validate example episode
        run: python cli/validate_episode.py examples/mock_episode.json
      - name: Export LeRobot
        run: python cli/export_lerobot.py examples/mock_episode.json /tmp/lerobot.json
      - name: Export RLDS
        run: python cli/export_rlds.py examples/mock_episode.json /tmp/rlds.json
