[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auraone-evalkit"
version = "0.2.1"
description = "Local Python CLI for AI evaluation rubrics, deterministic scoring, reviewer agreement, drift detection, leakage audits, and eval reports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = [
  "ai-evaluation",
  "evals",
  "rubrics",
  "rubric-validation",
  "rubric-linting",
  "model-evaluation",
  "llm-evaluation",
  "deterministic-scoring",
  "reviewer-agreement",
  "inter-annotator-agreement",
  "drift-detection",
  "leakage-audit",
  "python-cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["rubric-spec>=0.1.1", "iaa-kit>=0.1.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0", "build>=1.0"]

[project.urls]
Homepage = "https://auraone.ai/open"
Documentation = "https://auraone.ai/open/private-evals"
Source = "https://github.com/auraoneai/open"
Issues = "https://github.com/auraoneai/open/issues"
Changelog = "https://github.com/auraoneai/open/blob/main/CHANGELOG.md"
Security = "https://github.com/auraoneai/open/blob/main/SECURITY.md"
CI = "https://github.com/auraoneai/open/actions/workflows/ci.yml"

[project.scripts]
evalkit = "auraone_evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auraone_evalkit = ["schema/*.json", "reports/templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
