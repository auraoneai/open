name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evalkit:
    name: evalkit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/evalkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          python -m pip install "git+https://github.com/auraoneai/rubric-spec.git" "git+https://github.com/auraoneai/iaa-kit.git"
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p no:cacheprovider -q tests
      - name: Build wheel + sdist
        run: python -m build
      - name: Twine check
        run: |
          python -m pip install twine
          twine check dist/*

  robotics-reviewkit:
    name: robotics-reviewkit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: robotics-reviewkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest jsonschema pyyaml
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -p no:cacheprovider -q tests
      - name: Validate example episode
        run: python cli/validate_episode.py examples/mock_episode.json
      - name: Export LeRobot
        run: python cli/export_lerobot.py examples/mock_episode.json /tmp/lerobot.json
      - name: Export RLDS
        run: python cli/export_rlds.py examples/mock_episode.json /tmp/rlds.json
