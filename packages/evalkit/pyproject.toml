[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auraone-evalkit"
version = "0.2.0"
description = "Local open-source evaluation tooling for rubric validation, linting, and deterministic scoring."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["evals", "rubrics", "model-evaluation", "human-feedback", "auraone"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["rubric-spec>=0.1.1", "iaa-kit>=0.1.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0", "build>=1.0"]

[project.urls]
Homepage = "https://auraone.ai/open"
Documentation = "https://auraone.ai/open/private-evals"
Source = "https://github.com/auraoneai/open"
Issues = "https://github.com/auraoneai/open/issues"

[project.scripts]
evalkit = "auraone_evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auraone_evalkit = ["schema/*.json", "reports/templates/*.j2"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
